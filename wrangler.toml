name = "freetokenbox"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# D1 database for token entries
[[d1_databases]]
binding = "DB"
database_name = "freetokenbox"
# 占位 ID：先运行 `wrangler d1 create freetokenbox` 获取真实 database_id 后替换
database_id = "1c8c113d-9e6e-4243-9e65-fbdfdd643582"

# KV for optional caching (currently unused; reserved for future use)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ===== Secrets (set via `wrangler secret put`) =====
# ADMIN_PASSWORD   — 后台登录密码（必填）
# SESSION_SECRET   — 会话签名密钥（必填，可用 `openssl rand -hex 32` 生成）
# API_KEYS         — 允许写接口的 API Key 列表，逗号分隔（可选）
# ADSENSE_CLIENT_ID — Google AdSense publisher id，如 ca-pub-123456789 (可选)
# SITE_URL         — 站点公开地址，用于 sitemap/canonical，如 https://freetokenbox.pages.dev (可选)
