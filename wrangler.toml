name = "freetokenbox"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 自定义域名（Cloudflare 自动创建 DNS 记录 + 颁发证书）
routes = [
  { pattern = "freetokenbox.com", custom_domain = true },
  { pattern = "www.freetokenbox.com", custom_domain = true },
]

# D1 database for token entries
[[d1_databases]]
binding = "DB"
database_name = "freetokenbox"
database_id = "830a4c5a-5a54-4f09-ba65-b50cf1798470"

# KV for optional caching (currently unused; reserved for future use)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ===== Secrets (set via `wrangler secret put`) =====
# ADMIN_PASSWORD   — 后台登录密码（必填）
# SESSION_SECRET   — 会话签名密钥（必填，可用 `openssl rand -hex 32` 生成）
# API_KEYS         — 允许写接口的 API Key 列表，逗号分隔（可选）
# ADSENSE_CLIENT_ID — Google AdSense publisher id，如 ca-pub-123456789 (可选)
# SITE_URL         — 站点公开地址，用于 sitemap/canonical，如 https://freetokenbox.pages.dev (可选)
